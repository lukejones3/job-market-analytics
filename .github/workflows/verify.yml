name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.lock
      - run: python -m compileall -q python tests airflow
      - run: ruff check python tests airflow
      - run: pip-audit -r requirements.lock
      - run: pytest
